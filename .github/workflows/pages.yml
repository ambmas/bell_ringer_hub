name: Validate and Deploy Classroom Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate lessons and package site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate all lesson banks, site routes and scripts
        run: node --test tests/site.test.mjs

      - name: Assemble public site only
        run: |
          mkdir -p dist/business-walrus
          cp index.html styles.css app.js monday.js tuesday.js wednesday.js thursday.js friday.js dist/
          cp business-walrus/index.html dist/business-walrus/index.html
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/business-walrus/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy tested main branch
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
